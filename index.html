<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-light.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- Manifest ditautkan STATIS, bukan hanya disuntik lewat JS: PWABuilder dan
         Lighthouse membacanya dari HTML mentah. main.tsx mengganti href ini ke
         /api/pwa/manifest milik lembaga begitu PWA lembaga diaktifkan di Pengaturan. -->
    <link id="pwa-manifest" rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JURNALKU" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Poppins untuk halaman publik (design system SISFO) — font fallback Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- CAPTCHA self-hosted (soal matematika) dirender penuh di server sendiri;
         tidak ada script pihak ketiga (Google/Cloudflare) yang dibutuhkan. -->


    <!-- Isi di antara penanda SEO:START/SEO:END diganti per permintaan oleh server
         (renderIndexSeo di server/index.cjs) mengikuti lembaga pemilik domain —
         jadi setiap domain menyajikan judul, deskripsi, canonical, dan og:* miliknya
         sendiri. JANGAN hapus penandanya. Nilai di bawah adalah cadangan untuk dev. -->
    <!--SEO:START-->
    <title>JURNALKU - Sistem Informasi Manajemen Sekolah/Madrasah</title>
    <meta name="description" content="JURNALKU — sistem informasi manajemen sekolah & madrasah: jurnal mengajar, absensi siswa/guru (QR & RFID), penilaian, rapor, keuangan, dan notifikasi WhatsApp." />
    <meta name="application-name" content="JURNALKU" />
    <link rel="canonical" href="https://jurnalmadrasah.web.id/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="JURNALKU" />
    <meta name="keywords" content="aplikasi sekolah, sistem informasi madrasah, jurnal mengajar, absensi QR, absensi RFID, rapor digital, e-rapor, manajemen sekolah, jurnalku" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JURNALKU" />
    <meta property="og:title" content="JURNALKU - Sistem Informasi Manajemen Sekolah/Madrasah" />
    <meta property="og:description" content="Jurnal mengajar, absensi QR/RFID, penilaian, rapor, keuangan, dan notifikasi WhatsApp dalam satu aplikasi." />
    <meta property="og:url" content="https://jurnalmadrasah.web.id/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JURNALKU - Sistem Informasi Manajemen Sekolah/Madrasah" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JURNALKU - Sistem Informasi Manajemen Sekolah/Madrasah" />
    <meta name="twitter:description" content="Jurnal mengajar, absensi QR/RFID, penilaian, rapor, keuangan, dan notifikasi WhatsApp dalam satu aplikasi." />
    <meta name="twitter:image" content="/og-image.png" />
    <!--SEO:END-->

    <!-- Skeleton awal: mencegah layar putih saat koneksi lambat (Vite mengganti #root saat mount). -->
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f8fafc;z-index:9999;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      #boot-splash .boot-logo{width:76px;height:76px;object-fit:contain}
      #boot-splash .boot-spin{width:34px;height:34px;border:3px solid #cbd5e1;border-top-color:#1e40af;border-radius:50%;animation:bootspin .8s linear infinite}
      #boot-splash p{margin:0;color:#475569;font-size:13px}
      #boot-splash .boot-skel{width:min(320px,70vw);display:flex;flex-direction:column;gap:8px;margin-top:4px}
      #boot-splash .boot-skel span{height:10px;border-radius:6px;background:linear-gradient(90deg,#e2e8f0,#f1f5f9,#e2e8f0);background-size:200% 100%;animation:bootshimmer 1.2s ease-in-out infinite}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      @keyframes bootshimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      html.dark #boot-splash{background:#0f172a}
      html.dark #boot-splash p{color:#94a3b8}
      html.dark #boot-splash .boot-skel span{background:linear-gradient(90deg,#1e293b,#334155,#1e293b);background-size:200% 100%}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <img class="boot-logo" src="/logo-jurnalku-256.png" alt="JURNALKU" width="76" height="76" />
      <div class="boot-spin"></div>
      <div class="boot-skel"><span style="width:100%"></span><span style="width:82%"></span><span style="width:64%"></span></div>
      <p>Memuat JURNALKU…</p>
    </div>
    <script>
      // Hilangkan splash segera setelah React memasang konten pertamanya.
      (function(){
        var splash=document.getElementById('boot-splash');
        if(!splash) return;
        var done=false;
        function hide(){ if(done) return; done=true; splash.style.transition='opacity .25s'; splash.style.opacity='0'; setTimeout(function(){ splash&&splash.remove() },300) }
        var root=document.getElementById('root');
        new MutationObserver(function(_m,obs){
          if(root && root.childNodes.length){ hide(); obs.disconnect() }
        }).observe(root,{childList:true});
        // jaring pengaman bila React gagal total (mis. error JS) — tetap tampilkan pesan, jangan splash selamanya.
        setTimeout(function(){ if(!done && root && root.childNodes.length) hide() },8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
